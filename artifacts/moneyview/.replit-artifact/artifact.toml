kind = "web"
previewPath = "/"
title = "MoneyView"
description = "A Nigerian retail-banking dashboard for account balances, transactions, and spending insights in naira."
version = "1.0.0"
id = "artifacts/moneyview"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23389

[services.development]
run = "pnpm --filter @workspace/moneyview run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/moneyview", "run", "build" ]
serve = "static"
publicDir = "artifacts/moneyview/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23389"
BASE_PATH = "/"

[[services]]
name = "Mock API"
paths = ["/moneyview-api"]
localPort = 4000

[services.development]
run = "pnpm --filter @workspace/moneyview run mock-api"
