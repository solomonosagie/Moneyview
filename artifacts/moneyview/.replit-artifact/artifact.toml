kind = "web"
previewPath = "/"
title = "MoneyView"
description = "A fictional Nigerian retail banking dashboard for learners to explore sample balances and transactions in naira. This project uses fictional data only and will not connect to real banking or payment services."
version = "1.0.0"
id = "artifacts/moneyview"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23389

[services.development]
run = "pnpm --filter @workspace/moneyview run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/moneyview", "run", "build" ]
serve = "static"
publicDir = "artifacts/moneyview/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23389"
BASE_PATH = "/"
